name: Check
on:
  push:
    branches: ['main']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/updater-test.php
      - run: php tools/build-release.php
